name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: etl_test
          POSTGRES_PASSWORD: etl_test_password
          POSTGRES_DB: etl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U etl_test -d etl_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      ETL_TEST_POSTGRES_DSN: postgresql://etl_test:etl_test_password@localhost:5432/etl_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest

      - name: Run Ruff lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Validate committed runnable configs
        run: etl validate-all configs

      - name: Compile application and DAG files
        run: python -m compileall -q src airflow/dags

      - uses: actions/setup-node@v4
        with:
          node-version: "24.16.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify frontend
        working-directory: frontend
        run: npm run typecheck && npm run lint && npm run test && npm run build
