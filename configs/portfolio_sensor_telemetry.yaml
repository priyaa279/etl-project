config_schema_version: "1.0"

dataset:
  name: portfolio_sensor_telemetry

review:
  required: true
  approved: true
  approved_by: priyaa

orchestration:
  enabled: true
  schedule: "0 5 * * *"
  retries: 2
  retry_delay_minutes: 5

source:
  type: parquet
  path: data/incoming/portfolio_sensor_telemetry.parquet

runtime:
  raw_root: data/raw

normalization:
  trim_strings: true
  null_tokens: [""]

columns:
  device_id:
    source: device_id
    type: string
    nullable: false
  reading:
    source: reading
    type: string
    nullable: false
  quality:
    source: quality
    type: string
    nullable: false
  observed_at:
    source: observed_at
    type: timestamp
    nullable: false

transformations:
  - id: T001
    type: cast
    column: reading
    datatype: decimal
  - id: T002
    type: map
    column: quality
    mappings:
      OK: ACCEPTED
      BAD: REJECTED
  - id: T003
    type: filter
    condition: quality = 'ACCEPTED'
  - id: T004
    type: deduplicate
    keys: [device_id]
    order_by:
      observed_at: desc
  - id: T005
    type: derive
    target_column: adjusted_reading
    datatype: decimal
    expression: reading + 0.5

contracts:
  - id: DQ001
    type: not_null
    column: device_id
  - id: DQ002
    type: unique
    columns: [device_id, observed_at]
  - id: DQ003
    type: range
    column: adjusted_reading
    min: 0
    max: 100

schema_drift:
  added_columns: warn
  removed_columns: fail
  datatype_change: fail
  canonical_change: fail

load:
  strategy: incremental
  watermark:
    column: observed_at
    type: timestamp
  connection_env: ETL_POSTGRES_DSN
  schema: public
  staging_table: portfolio_sensor_telemetry_staging
  target_table: portfolio_sensor_telemetry
