config_schema_version: "1.0"
dataset:
  name: nested_order_items
review:
  required: true
  approved: true
  approved_by: priyaa
source:
  type: json
  path: data/incoming/nested_orders.json
runtime:
  raw_root: data/raw
normalization:
  trim_strings: true
  null_tokens: [""]
  json:
    root_path: orders
    fields:
      order_id: order.id
      customer_id: customer.id
      order_date: order.date
    explode:
      path: items
      as: item
      fields:
        product_id: item.product_id
        quantity: item.quantity
columns:
  order_id:
    type: string
    nullable: false
  customer_id:
    type: string
    nullable: false
  order_date:
    type: date
    format: "%Y-%m-%d"
    nullable: false
  product_id:
    type: string
    nullable: false
  quantity:
    type: integer
    nullable: false
transformations: []
contracts: []
schema_drift:
  added_columns: warn
  removed_columns: fail
  datatype_change: fail
  canonical_change: fail
load:
  strategy: full
  connection_env: ETL_POSTGRES_DSN
  schema: public
  staging_table: nested_order_items_staging
  target_table: nested_order_items
